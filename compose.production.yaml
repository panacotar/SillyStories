name: silly-stories

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *defaults
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [public, frontend]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 100

  app:
    <<: *defaults
    image: ${APP_IMAGE:-silly-stories:local}
    build: .
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
      TRUST_PROXY_HOPS: "1"
      MONGODB_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets: [mongo_app_password]
    networks: [frontend, database]
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 384m
    pids_limit: 100

  mongodb:
    <<: *defaults
    # Keep compatibility with the existing local MongoDB version.
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: sillyStories
    secrets: [mongo_root_password, mongo_app_password]
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
      - ./deploy/mongo-tools.sh:/usr/local/bin/silly-mongo-tools:ro
    networks: [database]
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "sh", "/usr/local/bin/silly-mongo-tools", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    mem_limit: 768m
    pids_limit: 150

networks:
  public:
  frontend:
    internal: true
  database:
    internal: true

volumes:
  mongodb_data:
  mongodb_config:
  caddy_data:
  caddy_config:

secrets:
  mongo_root_password:
    file: ./deploy/secrets/mongo_root_password
  mongo_app_password:
    file: ./deploy/secrets/mongo_app_password
